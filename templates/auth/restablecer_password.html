{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <img class="auth-logo" src="{{ url_for('static', filename='img/logo-kibax.png') }}"
         alt="Kiba X — Sistema de odontograma y radiografías">
    <p class="eyebrow">Acceso privado</p>
    <h1>Nueva contraseña</h1>
    <p class="auth-sub">Elegí una contraseña nueva. Tiene que tener al menos 8
      caracteres, una mayúscula, un número y un carácter especial.</p>

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña nueva</label>
        <input class="form-control" type="password" id="password" name="password"
               required autofocus autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password2">Repetir la contraseña nueva</label>
        <input class="form-control" type="password" id="password2" name="password2"
               required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-solid w-100 py-2">Guardar contraseña</button>
    </form>

    <p class="auth-foot"><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
  </div>
</div>
{% endblock %}
